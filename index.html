<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IGŁA - Platforma Quizowa</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <header>
            <h1 class="logo">IGŁA <span>Quizy</span></h1>
        </header>

        <div id="start-screen" class="screen active">
            <h2>Witaj w Strefie Quizów IGŁA!</h2>
            <p>Sprawdź swoją wiedzę w naszym szybkim teście. Czy zdołasz zdobyć maksymalną liczbę punktów?</p>
            <button id="start-btn" class="btn">Rozpocznij Quiz</button>
        </div>

        <div id="quiz-screen" class="screen">
            <div class="quiz-info">
                <span id="question-counter">Pytanie 1 z 4</span>
                <span id="timer">Czas: 15s</span>
            </div>
            
            <div class="progress-bar">
                <div id="progress" class="progress"></div>
            </div>

            <h3 id="question-text">Tutaj pojawi się treść pytania?</h3>

            <div id="answers-container" class="answers-grid">
            </div>
        </div>

        <div id="result-screen" class="screen">
            <h2>Koniec Quizu!</h2>
            <p id="result-message">Twój wynik:</p>
            <div class="score-card">
                <span id="final-score">0</span> / <span id="max-score">4</span>
            </div>
            <button id="restart-btn" class="btn">Rozegraj ponownie</button>
        </div>
    </div>

     <script>
        const quizData = [
            {
                question: "Która planeta w Układzie Słonecznym jest najbliżej Słońca?",
                answers: ["Wenus", "Merkury", "Ziemia", "Mars"],
                correct: 1
            },
            {
                question: "Jaki jest pierwiastek chemiczny o symbolu 'O'?",
                answers: ["Złoto", "Tlen", "Srebro", "Wodór"],
                correct: 1
            },
            {
                question: "W którym roku odbył się pierwszy lot w kosmos człowieka (Jurij Gagarin)?",
                answers: ["1957", "1961", "1969", "1972"],
                correct: 1
            },
            {
                question: "Który język programowania jest używany głównie do stylizowania stron WWW?",
                answers: ["HTML", "Python", "CSS", "C++"],
                correct: 2
            }
        ];

        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const questionText = document.getElementById('question-text');
        const answersContainer = document.getElementById('answers-container');
        const questionCounter = document.getElementById('question-counter');
        const progress = document.getElementById('progress');
        const finalScore = document.getElementById('final-score');
        const maxScore = document.getElementById('max-score');
        const timerDisplay = document.getElementById('timer');

        let currentQuestionIndex = 0;
        let score = 0;
        let timer;
        let timeLeft = 15;

        maxScore.textContent = quizData.length;

        startBtn.addEventListener('click', startQuiz);
        restartBtn.addEventListener('click', startQuiz);

        function startQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            startScreen.classList.remove('active');
            resultScreen.classList.remove('active');
            quizScreen.classList.add('active');
            loadQuestion();
        }

        function loadQuestion() {
            resetTimer();
            let currentQuiz = quizData[currentQuestionIndex];
            questionText.textContent = currentQuiz.question;
            questionCounter.textContent = `Pytanie ${currentQuestionIndex + 1} z ${quizData.length}`;
            progress.style.width = `${((currentQuestionIndex) / quizData.length) * 100}%`;

            answersContainer.innerHTML = '';
            currentQuiz.answers.forEach((answer, index) => {
                const btn = document.createElement('button');
                btn.textContent = answer;
                btn.classList.add('answer-btn');
                btn.addEventListener('click', () => selectAnswer(index));
                answersContainer.appendChild(btn);
            });
        }

        function startTimer() {
            timeLeft = 15;
            timerDisplay.textContent = `Czas: ${timeLeft}s`;
            timer = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = `Czas: ${timeLeft}s`;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    handleTimeOut();
                }
            }, 1000);
        }

        function resetTimer() {
            clearInterval(timer);
            startTimer();
        }

        function handleTimeOut() {
            const buttons = answersContainer.children;
            const correctIndex = quizData[currentQuestionIndex].correct;
            buttons[correctIndex].classList.add('correct');
            disableButtons();

            setTimeout(() => {
                currentQuestionIndex++;
                if (currentQuestionIndex < quizData.length) {
                    loadQuestion();
                } else {
                    showResults();
                }
            }, 1500);
        }

        function selectAnswer(selectedIndex) {
            clearInterval(timer);
            const correctIndex = quizData[currentQuestionIndex].correct;
            const buttons = answersContainer.children;

            if (selectedIndex === correctIndex) {
                buttons[selectedIndex].classList.add('correct');
                score++;
            } else {
                buttons[selectedIndex].classList.add('wrong');
                buttons[correctIndex].classList.add('correct');
            }

            disableButtons();

            setTimeout(() => {
                currentQuestionIndex++;
                if (currentQuestionIndex < quizData.length) {
                    loadQuestion();
                } else {
                    showResults();
                }
            }, 1500);
        }

        function disableButtons() {
            const buttons = answersContainer.children;
            for (let btn of buttons) {
                btn.disabled = true;
            }
        }

        function showResults() {
            quizScreen.classList.remove('active');
            resultScreen.classList.add('active');
            finalScore.textContent = score;
        }
    </script>
</body>
</html>
